name: Voyager pipeline (fetch + forecast + deploy)

# Replaces deploy-pages.yml, update-forecast.yml, and update-live-stats.yml.
# Having three separate workflows that could each independently deploy
# Pages (sharing a "pages" concurrency group, each with their own
# configure-pages/upload-pages-artifact/deploy-pages steps) was more moving
# parts than this needs, and made it hard to know which one actually
# produced what's live. One workflow, one job, one deploy step at the very
# end of every run -- whatever this run just committed is exactly what gets
# deployed, every time, with nothing else able to race it or supersede it.
#
# This also sidesteps a real gotcha the three-file version had to work
# around twice: a commit made with the default GITHUB_TOKEN (the git push
# step below) does NOT trigger ANY workflow's `on: push` -- including this
# same workflow's own push trigger. So this file's own data-commit can
# never cause an infinite retrigger loop, and the fix that was previously
# "deploy inline because push-chaining won't fire" is now just "there's
# only one place that ever deploys."
#
# One-time repo setting this still depends on: Settings -> Pages ->
# Source: "GitHub Actions" (not "Deploy from a branch").

on:
  workflow_dispatch:
    inputs:
      start_year:
        # The original notebook fit its MinMaxScaler on 1977-2015 data --
        # this pipeline refits a scaler each run on whatever range it
        # fetches, so starting in 1977 keeps that scaler close to the one
        # location_model.h5/param_model.h5 actually trained under, instead
        # of an arbitrary, disjoint recent window.
        description: "First year of real NASA data to fetch for the forecast"
        default: "1977"
      end_year:
        description: "Last year of real NASA data to fetch for the forecast"
        default: "2025"
      run_forecast:
        description: "Also re-run the full forecast (slow: fetches ~49 years of NASA files + loads TensorFlow). Live stats always run regardless."
        type: boolean
        default: true
  schedule:
    - cron: "15 * * * *"  # hourly, :15 -- live stats only (see the gate step)
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC -- full forecast too
  push:
    branches: [main]
    paths:
      - "voyager-forecast-pipeline/web/index.html"
      - "voyager-forecast-pipeline/src/**"
      - "voyager-forecast-pipeline/models/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tensorflow-cpu pandas numpy scikit-learn requests

      - name: Always refresh live Voyager position + solar wind (cheap, a couple of HTTP calls)
        working-directory: voyager-forecast-pipeline
        run: python src/fetch_live_data.py --out web/live.json

      - name: Decide whether to also re-run the full forecast this run
        id: gate
        run: |
          # The hourly cron is live-stats only -- never re-run the heavy
          # forecast on that one. Every other trigger (the weekly cron, a
          # manual dispatch, or a push touching src/models) re-runs it,
          # unless a manual dispatch explicitly set run_forecast=false.
          if [ "${{ github.event.schedule }}" = "15 * * * *" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=${{ github.event.inputs.run_forecast != 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch real NASA data + run forecast (slow: full historical range)
        if: steps.gate.outputs.run == 'true'
        working-directory: voyager-forecast-pipeline
        run: |
          python src/run_pipeline.py \
            --satellite vy2 \
            --start-year "${{ github.event.inputs.start_year || '1977' }}" \
            --end-year "${{ github.event.inputs.end_year || '2025' }}" \
            --future-hours 240 \
            --out web/forecast.json \
            --allow-demo-fallback

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voyager-forecast-pipeline/web/live.json voyager-forecast-pipeline/web/forecast.json
          git diff --cached --quiet || git commit -m "Update live stats / forecast data"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: voyager-forecast-pipeline/web

      - id: deployment
        uses: actions/deploy-pages@v4
