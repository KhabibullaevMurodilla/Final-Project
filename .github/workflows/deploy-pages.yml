name: Deploy results page to GitHub Pages

# Also belongs at the REPO ROOT: your-repo/.github/workflows/deploy-pages.yml
#
# This replaces "Deploy from a branch" entirely -- that method only lets you
# pick / (repo root) or /docs as the served folder, and defaults to running
# everything through Jekyll, which is what broke (it looked for a /docs
# folder and a Jekyll theme that this plain HTML page doesn't have or need).
#
# Deploying via Actions instead serves voyager-forecast-pipeline/web/ exactly
# as-is, no Jekyll, no /docs folder required.
#
# One-time repo setting: Settings -> Pages -> Source: "GitHub Actions"
# (NOT "Deploy from a branch"). Nothing else to configure there.

on:
  push:
    branches: [main]
    paths:
      - "voyager-forecast-pipeline/web/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: voyager-forecast-pipeline/web

      - id: deployment
        uses: actions/deploy-pages@v4
