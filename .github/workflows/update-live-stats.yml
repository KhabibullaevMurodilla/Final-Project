name: Update live Voyager + solar wind stats

# Also belongs at the REPO ROOT: your-repo/.github/workflows/update-live-stats.yml
# Lightweight and frequent (hourly) -- unlike update-forecast.yml, this doesn't
# load TensorFlow or run the models, just two small HTTP calls, so it's cheap
# to run often.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"  # hourly, at :15

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  live-stats:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live Voyager position + solar wind
        working-directory: voyager-forecast-pipeline
        run: python src/fetch_live_data.py --out web/live.json

      - name: Commit updated live stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voyager-forecast-pipeline/web/live.json
          git diff --cached --quiet || git commit -m "Update live Voyager + solar wind stats"
          git push

      # See update-forecast.yml for why this step is here: a bot-authored
      # push does not trigger deploy-pages.yml's own `push` event, so
      # without deploying here directly, this hourly update would write
      # real data to the repo every hour while the live site kept showing
      # whatever was deployed at the last human push.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: voyager-forecast-pipeline/web
      - id: deployment
        uses: actions/deploy-pages@v4
